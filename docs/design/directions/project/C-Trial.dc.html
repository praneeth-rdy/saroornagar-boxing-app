<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction C book a trial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:#7A1F2B}a:hover{color:#5E1721}input::placeholder,textarea::placeholder{color:#6B6259}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4EFE6;color:#1A1714;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:56px 20px 0;display:flex;align-items:center;gap:8px">
    <a href="#back" aria-label="Back" style="width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;text-decoration:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A1F2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></a>
    <div style="font-size:13px;font-weight:600;color:#6B6259;letter-spacing:1px">SAROORNAGAR BOXING</div>
  </div>
  <div style="padding:8px 20px 0;display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-family:'DM Serif Display',serif;font-size:36px;font-weight:400;letter-spacing:-0.3px">Try a session</h1>
    <div style="font-size:15px;color:#6B6259;line-height:1.4">Pick a day and a batch. The club confirms your slot.</div>
  </div>

  <div style="margin:20px 20px 0;background:#FFFDF8;border:1px solid #E3DACB;border-radius:14px;overflow:hidden;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid #E3DACB">
      <label for="c-name" style="font-size:15px;width:64px">Name</label>
      <input id="c-name" type="text" placeholder="Your full name" style="flex:1;height:44px;border:0;background:transparent;font:400 15px 'DM Sans',sans-serif;color:#1A1714;text-align:right">
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:6px 16px">
      <label for="c-tel" style="font-size:15px;width:64px">Phone</label>
      <input id="c-tel" type="tel" placeholder="+91" style="flex:1;height:44px;border:0;background:transparent;font:400 15px 'DM Sans',sans-serif;color:#1A1714;text-align:right">
    </div>
  </div>

  <div style="padding:24px 20px 0;display:flex;flex-direction:column;gap:10px">
    <div style="font-size:13px;font-weight:600;color:#6B6259;letter-spacing:1px">DAY</div>
    <div style="display:flex;gap:8px">
      <button style="height:40px;padding:0 16px;border:1px solid #E3DACB;border-radius:10px;background:#FFFDF8;color:#1A1714;font:500 14px 'DM Sans',sans-serif">Thu 5</button>
      <button aria-pressed="true" style="height:40px;padding:0 16px;border:0;border-radius:10px;background:#7A1F2B;color:#FFFDF8;font:600 14px 'DM Sans',sans-serif">Fri 6</button>
      <button style="height:40px;padding:0 16px;border:1px solid #E3DACB;border-radius:10px;background:#FFFDF8;color:#1A1714;font:500 14px 'DM Sans',sans-serif">Sat 7</button>
      <button style="height:40px;padding:0 16px;border:1px solid #E3DACB;border-radius:10px;background:#FFFDF8;color:#1A1714;font:500 14px 'DM Sans',sans-serif">Mon 9</button>
    </div>
  </div>

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:10px">
    <div style="font-size:13px;font-weight:600;color:#6B6259;letter-spacing:1px">BATCH</div>
    <div style="display:flex;gap:10px">
      <button style="flex:1;height:64px;border:1px solid #E3DACB;padding:0 13px;border-radius:10px;background:#FFFDF8;color:#1A1714;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;font-family:'DM Sans',sans-serif"><span style="font-family:'DM Serif Display',serif;font-size:17px;font-weight:400;letter-spacing:-0.3px">Morning</span><span style="font-size:12px;color:#6B6259">Early batch</span></button>
      <button aria-pressed="true" style="flex:1;height:64px;border:2px solid #7A1F2B;border-radius:10px;background:#FFFDF8;color:#1A1714;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 12px;gap:2px;font-family:'DM Sans',sans-serif"><span style="font-family:'DM Serif Display',serif;font-size:17px;font-weight:400;letter-spacing:-0.3px;color:#7A1F2B">Evening</span><span style="font-size:12px;color:#6B6259">After work</span></button>
    </div>
  </div>

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:10px">
    <label for="c-note" style="font-size:13px;font-weight:600;color:#6B6259;letter-spacing:1px">ANYTHING WE SHOULD KNOW (OPTIONAL)</label>
    <textarea id="c-note" placeholder="Boxed before? Any injury?" style="height:88px;border:1px solid #E3DACB;border-radius:10px;background:#FFFDF8;padding:12px 14px;font:400 15px 'DM Sans',sans-serif;color:#1A1714;resize:none;box-sizing:border-box"></textarea>
  </div>

  <div style="margin-top:auto;padding:0 20px 34px;display:flex;flex-direction:column;gap:12px">
    <button style="height:52px;border:0;border-radius:10px;background:#7A1F2B;color:#FFFDF8;font:600 16px 'DM Sans',sans-serif">Book trial</button>
    <div style="text-align:center;font-size:12px;color:#6B6259">Already train here? <a href="#signin" style="font-weight:500;text-decoration:none">Sign in</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction D book a trial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:#C8F531}a:hover{color:#DBFF66}input::placeholder,textarea::placeholder{color:#9AA3B2}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0F1115;color:#F2F4F7;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:56px 20px 0;display:flex;align-items:center;gap:8px">
    <a href="#back" aria-label="Back" style="width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;text-decoration:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8F531" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></a>
    <div style="font-size:13px;font-weight:600;color:#9AA3B2;letter-spacing:1.5px">SAROORNAGAR BOXING</div>
  </div>
  <div style="padding:8px 20px 0;display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;letter-spacing:-1px">Try a session</h1>
    <div style="font-size:15px;color:#9AA3B2;line-height:1.4">Pick a day and a batch. The club confirms your slot.</div>
  </div>

  <div style="margin:20px 20px 0;background:#171A21;border-radius:12px;overflow:hidden;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid #262B35">
      <label for="d-name" style="font-size:15px;width:64px">Name</label>
      <input id="d-name" type="text" placeholder="Your full name" style="flex:1;height:44px;border:0;background:transparent;font:400 15px 'Space Grotesk',sans-serif;color:#F2F4F7;text-align:right">
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:6px 16px">
      <label for="d-tel" style="font-size:15px;width:64px">Phone</label>
      <input id="d-tel" type="tel" placeholder="+91" style="flex:1;height:44px;border:0;background:transparent;font:400 15px 'Space Grotesk',sans-serif;color:#F2F4F7;text-align:right">
    </div>
  </div>

  <div style="padding:24px 20px 0;display:flex;flex-direction:column;gap:10px">
    <div style="font-size:13px;font-weight:600;color:#9AA3B2;letter-spacing:1.5px">DAY</div>
    <div style="display:flex;gap:8px">
      <button style="height:40px;padding:0 16px;border:0;border-radius:8px;background:#171A21;color:#F2F4F7;font:500 14px 'Space Grotesk',sans-serif">Thu 5</button>
      <button aria-pressed="true" style="height:40px;padding:0 16px;border:0;border-radius:8px;background:#C8F531;color:#0F1115;font:600 14px 'Space Grotesk',sans-serif">Fri 6</button>
      <button style="height:40px;padding:0 16px;border:0;border-radius:8px;background:#171A21;color:#F2F4F7;font:500 14px 'Space Grotesk',sans-serif">Sat 7</button>
      <button style="height:40px;padding:0 16px;border:0;border-radius:8px;background:#171A21;color:#F2F4F7;font:500 14px 'Space Grotesk',sans-serif">Mon 9</button>
    </div>
  </div>

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:10px">
    <div style="font-size:13px;font-weight:600;color:#9AA3B2;letter-spacing:1.5px">BATCH</div>
    <div style="display:flex;gap:10px">
      <button style="flex:1;height:64px;border:0;padding:0 14px;border-radius:8px;background:#171A21;color:#F2F4F7;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;font-family:'Space Grotesk',sans-serif"><span style="font-size:15px;font-weight:700">Morning</span><span style="font-size:12px;color:#9AA3B2">Early batch</span></button>
      <button aria-pressed="true" style="flex:1;height:64px;border:2px solid #C8F531;border-radius:8px;background:#171A21;color:#F2F4F7;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 12px;gap:2px;font-family:'Space Grotesk',sans-serif"><span style="font-size:15px;font-weight:700;color:#C8F531">Evening</span><span style="font-size:12px;color:#9AA3B2">After work</span></button>
    </div>
  </div>

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:10px">
    <label for="d-note" style="font-size:13px;font-weight:600;color:#9AA3B2;letter-spacing:1.5px">ANYTHING WE SHOULD KNOW (OPTIONAL)</label>
    <textarea id="d-note" placeholder="Boxed before? Any injury?" style="height:88px;border:0;border-radius:8px;background:#171A21;padding:12px 14px;font:400 15px 'Space Grotesk',sans-serif;color:#F2F4F7;resize:none;box-sizing:border-box"></textarea>
  </div>

  <div style="margin-top:auto;padding:0 20px 34px;display:flex;flex-direction:column;gap:12px">
    <button style="height:52px;border:0;border-radius:8px;background:#C8F531;color:#0F1115;text-transform:uppercase;letter-spacing:0.5px;font:600 16px 'Space Grotesk',sans-serif">Book trial</button>
    <div style="text-align:center;font-size:12px;color:#9AA3B2">Already train here? <a href="#signin" style="font-weight:500;text-decoration:none">Sign in</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
